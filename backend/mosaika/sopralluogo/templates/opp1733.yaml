        ripetibile: true
      - testo: "Valvole termostatiche e ripartitori: marca, modello, data"
        evidenze: [F]
        capitolo: "1·2"
      - testo: "Temperatura superficiale dei radiatori con ora (termocamera)"
        evidenze: [F, M]
        capitolo: "—"
        unita_suggerita: "°C"
        con_ora: true
        ripetibile: true
      - testo: "Lamentele di comfort raccontate dagli occupanti (audio con consenso)"
        evidenze: [A]
        capitolo: "—"
        consenso_richiesto: true

  - codice: TET
    titolo: "6 · Copertura e fotovoltaico"
    sottotitolo: Falda sud-sud-est e porzione piana
