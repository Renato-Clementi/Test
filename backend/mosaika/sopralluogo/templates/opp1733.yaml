        evidenze: [F, T]
        capitolo: "5"
      - testo: "Riprese aeree o panoramiche di tutta la copertura (drone o video 360°)"
        evidenze: [F, V]
        capitolo: "5"
      - testo: "Misure falda SSE: gronda, larghezza, colmo-gronda; orientamento"
        evidenze: [M]
        capitolo: "5"
        unita_suggerita: m
        ripetibile: true
