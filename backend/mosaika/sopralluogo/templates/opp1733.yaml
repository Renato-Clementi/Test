        capitolo: esclusa
      - testo: "Percorso dei cavi dal tetto al quadro: cavedi, scale, facciate"
        evidenze: [F, M]
        capitolo: "5"
        unita_suggerita: m

  - codice: CAN
    titolo: "7 · Cantiere e vincoli"
