        evidenze: [A, T]
        capitolo: "4"
      - testo: "Vincoli di condominio: regolamento, consenso del civico 30 per il cortile"
        evidenze: [A, T]
        capitolo: "—"
      - testo: "Interviste ad amministratore, consiglieri, terzo responsabile (audio con consenso)"
        evidenze: [A]
        capitolo: "—"
        consenso_richiesto: true

  - codice: FIN
    titolo: Prima di andare via
    sottotitolo: Controlli prima di lasciare l'edificio
    tipo: chiusura
    voci:
      - testo: "Ogni capitolo ha almeno una foto d'insieme e le misure che lo quotano"
